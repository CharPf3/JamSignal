name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # The scoring fixtures are committed, so the model is validated without
      # network access or API keys.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Build must succeed without secrets — every integration degrades
          # rather than throwing when its key is absent.
          NEXT_TELEMETRY_DISABLED: '1'
